<!--
  templates/base.html

  Purpose:
    Layout inheritance root for all FictionWriter UI templates. Defines the
    page structure, loads all frontend dependencies (Bootstrap 5.3, Alpine.js,
    Chart.js, marked.js), links the custom theme stylesheet, and provides
    Jinja2 block placeholders for child templates to fill.

  Blocks:
    {% block title %}   — Page title suffix (e.g., "Dashboard", "Settings").
    {% block head %}    — Additional <head> content (per-page styles, meta tags).
    {% block content %} — Main page body content.
    {% block scripts %} — Per-page JavaScript (loaded after main.js).

  Dependencies loaded:
    - Bootstrap 5.3 (CSS + JS bundle with Popper)
    - Alpine.js 3.x (lightweight reactive directives)
    - Chart.js (PAD radar chart, stylometric drift line graph)
    - marked.js (Markdown rendering for planning bullet streams)
    - static/css/theme.css (deep slate dark mode palette overrides)
    - static/js/main.js (SSE EventSource, beat_start handler, auto-scroll)
-->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FictionWriter — {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">FictionWriter</span>
    <div class="d-flex gap-2">
      <a href="/" class="nav-link text-light">Dashboard</a>
      <a href="/alignment" class="nav-link text-light">Alignment</a>
      <a href="/settings" class="nav-link text-light">Settings</a>
      <a href="/codex" class="nav-link text-light">Codex</a>
    </div>
  </nav>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
