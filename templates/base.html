<!--
  templates/base.html

  Purpose:
    Layout inheritance root for all FictionWriter UI templates. Defines the
    page structure, loads all frontend dependencies (Bootstrap 5.3, Alpine.js,
    Chart.js, marked.js), links the custom theme stylesheet, and provides
    Jinja2 block placeholders for child templates to fill.

  Blocks:
    block "title"   — Page title suffix (e.g., "Dashboard", "Settings").
    block "head"    — Additional head content (per-page styles, meta tags).
    block "content" — Main page body content.
    block "scripts" — Per-page JavaScript (loaded after main.js).

  Dependencies loaded:
    - Bootstrap 5.3 (CSS + JS bundle with Popper)
    - Alpine.js 3.x (lightweight reactive directives)
    - Chart.js (PAD radar chart, stylometric drift line graph)
    - marked.js (Markdown rendering for planning bullet streams)
    - static/css/theme.css (deep slate dark mode palette overrides)
    - static/js/main.js (SSE EventSource, beat_start handler, auto-scroll)
-->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FictionWriter — {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav class="navbar navbar-dark fw-nav px-3">
    <span class="navbar-brand fw-bold fw-brand">Fiction<span class="accent">Writer</span></span>
    <div class="d-flex gap-1 align-items-center">
      <a href="/" class="nav-link" data-nav="/">Dashboard</a>
      <a href="/alignment" class="nav-link" data-nav="/alignment">Alignment</a>
      <a href="/codex" class="nav-link" data-nav="/codex">Codex</a>
      <a href="/settings" class="nav-link" data-nav="/settings">Settings</a>
      <span class="fw-status-dot ms-2" id="nav-status-dot"
            title="Generation status" aria-label="Generation status"></span>
    </div>
  </nav>

  <div class="fw-toasts" id="fw-toasts" aria-live="polite"></div>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
